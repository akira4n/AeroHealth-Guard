services:
  db:
    image: postgis/postgis:16-3.4
    container_name: aerohealth_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aerohealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-aerohealth_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aerohealth} -d ${POSTGRES_DB:-aerohealth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aerohealth-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aerohealth_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aerohealth}:${POSTGRES_PASSWORD:-your_secure_password}@db:5432/${POSTGRES_DB:-aerohealth_db}
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma db push && npm start"
    networks:
      - aerohealth-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aerohealth_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    networks:
      - aerohealth-network

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: aerohealth_ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-aerohealth}:${POSTGRES_PASSWORD:-your_secure_password}@db:5432/${POSTGRES_DB:-aerohealth_db}
      - WAQI_API_TOKEN=${WAQI_API_TOKEN}
      - OPENAQ_API_KEY=${OPENAQ_API_KEY}
      - NASA_FIRMS_MAP_KEY=${NASA_FIRMS_MAP_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CRON_INTERVAL_HOURS=${CRON_INTERVAL_HOURS:-3}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - aerohealth-network

volumes:
  pgdata:

networks:
  aerohealth-network:
    driver: bridge
